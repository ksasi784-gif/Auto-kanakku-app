name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake autopoint

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade "pip<24.0" "setuptools<69.0.0" wheel
          pip install "cython<3.0.0"
          pip install buildozer

      - name: Build with Buildozer
        env:
          PIP_NO_BUILD_ISOLATION: "0"
        run: |
          # pip auto-upgrade ஆவதைத் தடுக்கும் அமைப்பு
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoKanakku-APK
          path: bin/*.apk
